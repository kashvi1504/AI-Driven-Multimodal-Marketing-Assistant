<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentiment Studio</title>
  <meta name="description" content="AI-assisted marketing copy and creative analysis.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236A4CFF'/%3E%3Cstop offset='1' stop-color='%23FF5E9C'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M16 7l9 9-9 9-9-9z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="logo brand" href="/app#/dashboard"><span class="logo-mark"><svg viewBox="0 0 16 16"><path d="M8 1l7 7-7 7-7-7z"/></svg></span>Sentiment Studio</a>

      <nav class="nav" id="nav" aria-label="Main"></nav>

      <div class="system" id="system">
        <div class="system-title">System</div>
        <div class="system-row"><span class="dot dot-loading" id="model-dot"></span><span id="model-status">Starting models…</span></div>
        <details class="system-deps">
          <summary>Optional features</summary>
          <ul id="deps-list"></ul>
        </details>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="backdrop"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="topbar-title">
          <div class="crumb" id="crumb">Overview</div>
          <h1 id="page-title">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <button class="theme-toggle" data-theme-toggle aria-label="Switch light or dark mode">
            <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
          <div class="user-menu" id="user-menu">
            <button class="user-btn" id="user-btn" aria-haspopup="menu" aria-expanded="false">
              <span class="avatar" id="avatar">·</span><span class="user-name" id="user-name"></span>
              <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="menu" id="menu" role="menu" hidden>
              <div class="menu-head"><b id="menu-name"></b><span id="menu-email"></span></div>
              <a role="menuitem" href="/app#/dashboard">Dashboard</a>
              <a role="menuitem" href="/">Home page</a>
              <button role="menuitem" data-theme-toggle>Switch theme</button>
              <button role="menuitem" class="danger" id="logout">Log out</button>
            </div>
          </div>
        </div>
      </header>
      <section class="view" id="view" tabindex="-1"></section>
    </main>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
